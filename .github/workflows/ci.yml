name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff (lint)
        run: ruff check src tests examples benchmarks
      - name: ruff (format)
        run: ruff format --check src tests examples benchmarks
      - name: mypy (strict)
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: tests
        run: pytest --cov --cov-report=term
      - name: examples (smoke)
        run: |
          python examples/quickstart.py
          python examples/static_flow.py
          python examples/compare_market_makers.py --seeds 2 --horizon 2000
          python benchmarks/bench_book.py -n 20000 --repeat 1
